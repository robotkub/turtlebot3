# twist_mux for navigation.launch.py -- Nav2 drives by default (lowest
# priority), but keyboard/joy can take over at any moment for a manual
# override. Joy outranks keyboard so grabbing the controller always wins.
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
      teleop:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 50
      joy:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100
    # No `locks:` key -- an empty YAML list (`locks: []`) fails to load as a
    # ROS2 parameter at all (ambiguous element type), crashing the node with
    # "parameter_value_from failed for parameter 'locks'". This project
    # doesn't use any lock topics, so just omit the key entirely.
