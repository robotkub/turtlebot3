# slam_toolbox, online-async mapping mode -- the SLAM behind mapping.launch.py.
#
# The node name below MUST stay `slam_toolbox`, matching the `name=` given to
# the Node in mapping.launch.py; ROS 2 matches params to nodes by name and a
# mismatch silently leaves every value here at its library default.
#
# Async (not sync) because scans arrive faster than the pose graph can absorb
# them while driving: sync blocks the scan callback and drops the queue on a
# Pi-class robot, async keeps the last scan and optimizes behind it. Mapping
# quality is the same for an arena this size.
slam_toolbox:
  ros__parameters:

    # ---- frames + topics --------------------------------------------------
    # base_footprint (not base_link) is what the TurtleBot3 URDF puts on the
    # ground plane, and it's the frame odom is published against.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # slam_toolbox's own map saver, reachable at /slam_toolbox/save_map. Not
    # the primary path -- map_autosaver writes .pgm/.yaml continuously off
    # /map so a killed launch never loses the map -- but it's a useful manual
    # escape hatch, and it also serializes the pose graph, which the plain
    # occupancy grid can't do.
    use_map_saver: true

    # ---- rates ------------------------------------------------------------
    # 50 Hz map->odom. Nav2's costmaps and AMCL both fall over on a stale
    # transform, and this is cheap.
    transform_publish_period: 0.02
    # How often the /map OccupancyGrid is regenerated and published. Also the
    # ceiling on how fresh map_autosaver's output can be, so keep it well
    # under the autosaver's 15 s save period.
    map_update_interval: 1.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    minimum_time_interval: 0.5
    throttle_scans: 1
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    debug_logging: false

    # ---- geometry ---------------------------------------------------------
    # 0.05 m/px must match nav2_params.yaml and the existing maps/arena_v1 --
    # Nav2's map_server takes the resolution from the map yaml, but the
    # costmaps are tuned around this cell size.
    resolution: 0.05
    # LDS-01 on the burger is spec'd to 3.5 m. Claiming more just feeds
    # max-range returns into the graph as if they were real geometry.
    max_laser_range: 3.5

    # A new pose-graph node every 20 cm or ~11 deg. The arena is small and the
    # TurtleBot3 is slow, so this is dense enough to close loops without
    # growing the graph faster than the Pi can optimize it.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    # ---- scan matching ----------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ---- loop closure -----------------------------------------------------
    do_loop_closing: true
    # 3 m, roughly the arena's own scale -- searching further than the robot
    # can actually see just costs time and invites false matches between the
    # arena's repeated straight walls.
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- correlation / search windows -------------------------------------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ---- solver -----------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
