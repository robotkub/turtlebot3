# Nav2 parameters for the RobotKub TurtleBot3 Burger. This is the team's
# TUNABLE copy of the stock turtlebot3_navigation2 burger.yaml -- edit here,
# navigation.launch.py (and debug/competition) load this file by default.
# Common things to tune: costmap inflation_radius, controller max velocities,
# planner tolerance. See docs chapter 4.
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # Tuned to work harder than stock, because the compute moved off the Pi.
    # These all cost CPU, and the mission now runs in the laptop container
    # (see mission.launch.py) which has it to spare -- on the Pi the stock
    # numbers were about the ceiling.
    #
    # LDS-01 returns 360 points per scan and stock used 60 of them. More
    # beams per update = a sharper likelihood peak, which matters most in a
    # small arena where a 10 cm error is a large fraction of a zone.
    max_beams: 180
    max_particles: 3000
    min_particles: 800
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Was 0.0/0.0, i.e. recovery DISABLED: once AMCL's estimate went bad it
    # had no mechanism to inject fresh particles and would stay confidently
    # wrong until someone sent a pose estimate by hand. These are the ROS
    # defaults for the exponential filters that detect a poor match and
    # scatter random particles to recover. slow << fast is the point.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # How far the robot must move before AMCL bothers correcting itself.
    # Stock 0.25 m / 0.2 rad is sized for a big room; this arena's map is
    # 75 x 68 cells at 0.05 m = 3.75 x 3.4 m, so the robot could cross most
    # of a zone between updates and navigate on dead reckoning the whole way.
    # 0.10 m / 0.10 rad corrects roughly 2-3x more often.
    update_min_a: 0.1
    update_min_d: 0.1
    # Trust the scan more than the noise floor. z_hit 0.5 / z_rand 0.5 says
    # half of every reading is assumed random -- reasonable for a cheap
    # sensor in an unknown space, pessimistic for an LDS-01 against a map we
    # recorded ourselves. Weighting hits up sharpens the pose estimate; if
    # localization ever gets jumpy around unmapped clutter (people standing
    # near the arena), walk these back toward 0.5/0.5.
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: scan
    # Start localized instead of waiting for a human to send /initialpose.
    # Without this it's a chicken-and-egg: AMCL won't publish map->odom until
    # it has a pose, so the `map` TF frame doesn't exist, so Foxglove can't
    # render /map at all -- you end up staring at an empty 3D panel with no
    # map to click on to GIVE it the pose. It also spams
    # "AMCL cannot publish a pose or update the transform" forever.
    #
    # (0, 0, 0) is correct here, not arbitrary: slam_toolbox's map origin IS
    # wherever the robot stood when mapping started, i.e. the START box --
    # see the explanation in maps/start_pose.yaml. Keep these two in sync if
    # you ever re-record START to something non-zero (mission_manager also
    # re-publishes /initialpose from maps/start_pose.yaml on boot, so the
    # full mission self-corrects either way).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # Bumped from the stock 10.0 -- at max_vel_theta below (2.84 rad/s, up
    # from the stock 1.0), the robot covers a lot more ground/rotation
    # between control cycles at 10 Hz, which reads as jerky. 20 Hz keeps the
    # control loop tight relative to the higher speed. (This is the
    # CONTROLLER rate and is unrelated to planner_server's
    # expected_planner_frequency, which is 1.0 because the BT only asks for a
    # replan once a second.)
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Sized for this arena, not a warehouse. The map is 3.75 x 3.4 m and
      # zones sit about a metre apart, so a leg is short and a real share of
      # it is spent rotating rather than translating -- demanding 0.5 m of
      # travel every 10 s declared failure during perfectly normal
      # manoeuvring near a goal.
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Full speed = the Burger's actual hardware limits (ROBOTIS e-manual,
      # https://emanual.robotis.com/docs/en/platform/turtlebot3/features/):
      # max translational velocity 0.22 m/s, max rotational velocity
      # 2.84 rad/s. max_vel_x/max_speed_xy were already at the hardware cap;
      # max_vel_theta was stuck at the stock 1.0 rad/s -- raised to the real
      # limit.
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 2.84
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      # Path adherence. DWB scores each candidate trajectory; PathDist
      # penalizes ending far from the global plan and PathAlign penalizes
      # pointing away from it. What matters is their size RELATIVE to the
      # Goal* critics below -- Goal* pull straight at the goal, which is what
      # makes a robot cut corners instead of tracking the plan.
      #
      # REVERTED to 32/32 after the bump made driving worse. Raising these to
      # 48/40 is what the "stick to the plan more" request asked for, and the
      # very next runs filled with `controller_server: Failed to make
      # progress` -- the documented overshoot, and the one this comment used
      # to warn about. Over-weighted, DWB will happily score a slow
      # trajectory that sits exactly on the line above a quicker one that
      # deviates by centimetres, so the robot creeps and trips the progress
      # checker. Retune from here in smaller steps (36/34 next) and watch for
      # that log line.
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # The real burger. Its base collision box in turtlebot3_description's
      # URDF is 0.140 x 0.140 m, so the circumscribed radius is
      # 0.140*sqrt(2)/2 = 0.099 m -- which is why ROBOTIS's own
      # turtlebot3_navigation2/param/burger.yaml ships robot_radius: 0.1.
      #
      # This was 0.19, from "half of 178 mm plus a 0.10 m margin". 178 mm is
      # burger's LENGTH, not its width (138 mm), and the doubled-up margin
      # made Nav2 model a robot nearly 0.4 m across -- it refused gaps the
      # real robot walks through.
      #
      # Lowered to 0.12 -- close to the true 0.099 m circumscribed radius
      # plus a small margin, to let the planner take gaps the earlier 0.15
      # was refusing.
      robot_radius: 0.12
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Was 1.0 m, which on a 3 x 3 m rolling window inflated nearly the
        # whole local costmap and left the controller almost no free space to
        # steer into. 0.5 m is what upstream burger.yaml uses.
        # 0.5 -> 0.45. Small deliberate step: this arena is only 3.45 m wide,
        # so at 0.5 the halo from opposite walls consumed 1.0 m of it. Kept
        # conservative because the robot still has to not clip anything --
        # verify zone clearance with the planner tool rather than cutting
        # this further blind.
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # False, like every other node here. This was True (a leftover from the
      # upstream template) and it HID a real TF failure: with no /clock
      # publisher the node's now() is stuck at 0, and a tf lookup at time 0
      # means "latest available" rather than "now", so it never fails. That is
      # why global_costmap logged `Checking transform` -> `start` instantly
      # while local_costmap correctly spent 2.5s waiting for base_link->odom.
      # It silently swallows exactly the kind of stale-transform problem we
      # want to be loud.
      use_sim_time: False
      # Same reasoning as local_costmap's robot_radius above -- keep the two
      # in sync (Nav2 assumes one footprint across both costmaps).
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.55 -> 0.45, matching local_costmap. See the note there; Nav2's
        # 0.55 default is tuned for building corridors, not a 3.45 x 3.10 m
        # arena. NOTE: this does NOT rescue a goal whose clearance is under
        # the robot radius -- zone 3 sat at 0.09 m against a 0.10 m radius,
        # which is a lethal cell at any inflation. Move the zone instead.
        inflation_radius: 0.45
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # 1.0, not 20.0. This is only used to decide when to warn, and Nav2's
    # default BT wraps ComputePathToPose in a RateController at 1 Hz -- so at
    # 20.0 the server warned "Planner loop missed its desired rate of 20.0000
    # Hz. Current loop rate is 1.1487 Hz" on every single replan, describing
    # a rate nothing was ever asking for. Pure noise, and it buried the real
    # errors in the same logs.
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false  # Dijkstra -- explores uniformly instead of greedily toward the goal
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# Was `recoveries_server:` with `nav2_recoveries/*` plugins -- both are the
# Foxy/Galactic names. Humble renamed the node to behavior_server and the
# plugin namespace to nav2_behaviors, so NONE of this block was ever applied:
# the node fell back to its built-in defaults, which is why the logs show a
# `drive_on_heading` behavior that was not even listed here. The values below
# are deliberately identical to those defaults, so this makes the config
# honest without changing how the robot behaves.
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # `behavior_plugins`, not `recovery_plugins`, in Humble. drive_on_heading
    # is included because the default BT can call it -- dropping it here would
    # be a real regression the moment this block started taking effect.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    # `transform_tolerance` is the name behavior_server declares;
    # `transform_timeout` was silently ignored.
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
