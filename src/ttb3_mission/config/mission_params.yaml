# mission_manager tuning.
mission_manager:
    ros__parameters:
        tick_hz: 5.0

        # Where the robot starts / returns to (R6, R8) lives in ONE reference
        # file, not here -- so a captured START (drive there, call
        # /save_start_pose) is shared by everything. This is just the path to it.
        start_pose_file: "~/turtlebot3_ws/maps/start_pose.yaml"

        # Which zones to visit, in order, while searching for tags + victim
        # signs (R1/R2/R4) -- also just the path to a reference file, same
        # pattern as start_pose_file. See maps/mission_zones.yaml for the
        # actual coordinates (PLACEHOLDERS until real ones exist).
        zones_file: "~/turtlebot3_ws/maps/mission_zones.yaml"

        # Visual servo into the victim sign (R4).
        approach_bearing_gain: 0.8
        approach_linear_speed: 0.15
        approach_close_size: 0.20
        approach_center_tolerance: 0.15
        search_turn_rate: 0.3

        # Stuck watchdog (R7): no odom progress for this long -> stop and flag STUCK.
        stuck_timeout_sec: 10.0
        stuck_min_progress_m: 0.05
