# mission_manager tuning.
mission_manager:
    ros__parameters:
        tick_hz: 5.0

        # start_pose_file and zones_file are deliberately NOT set here.
        #
        # mission_manager resolves them at runtime (see paths.py) because the
        # same node runs on the Pi, where maps live in ~/turtlebot3_ws/maps,
        # and in the laptop container, where docker-compose.yml mounts them at
        # /maps. A pinned path can only be correct on one of the two.
        #
        # It was pinned to ~/turtlebot3_ws/maps here, and when the mission
        # moved into the container `~` became /root: neither reference file
        # existed, both loaders fell back to their placeholder constants, and
        # the robot localized to (0.25, 0.25) and drove to (0.5, 0.5) instead
        # of using the real saved START and zones. It logged nothing.
        #
        # Override only if you genuinely need a non-standard location.

        # Visual servo into the victim sign.
        approach_bearing_gain: 0.8
        approach_linear_speed: 0.15
        approach_close_size: 0.20
        approach_center_tolerance: 0.15
        search_turn_rate: 0.3
        # If the victim hasn't been seen for this long while APPROACH_VICTIM
        # is active, give up and fall back to SEARCH (re-scanning the same
        # zone, tag included) instead of spinning on /cmd_vel forever.
        approach_timeout_sec: 15.0

        # Confirm wait on arrival at a zone: hold still and keep checking for
        # a tag or victim sign (decide_dispense runs every tick regardless)
        # instead of leaving immediately. The robot used to reach a zone and
        # leave 0.18 s later, so anything not already in frame was missed
        # entirely. No left/right turning -- the robot already faces the
        # zone's goal heading on arrival.
        zone_scan_timeout_sec: 20.0

        # A NavigateToPose goal (SEARCH/RETURN_HOME) that hasn't finished
        # after this long is cancelled, both costmaps are cleared, and the
        # same goal is resent automatically -- no operator step needed.
        nav_goal_timeout_sec: 20.0
