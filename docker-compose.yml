services:
  ttb3-compute:
    build:
      context: .
      dockerfile: docker/Dockerfile
    stdin_open: true   # required for interactive commands (e.g. teleop_keyboard)
    tty: true          # allocates a pseudo-TTY so raw keystrokes are forwarded
    shm_size: '512mb'  # Docker's 64MB default is too small for rmw_zenoh_cpp's
                       # SHM transport once several nodes init concurrently --
                       # confirmed by hitting ENOMEM/std::bad_alloc across every
                       # node at once with the default size.
    devices:
      - "/dev/input:/dev/input"
    ports:
      # foxglove_bridge, for Foxglove Studio on the host. IMPORTANT: `docker
      # compose run` does NOT publish this by default (unlike `docker compose
      # up`) -- you must pass `--service-ports` on any run that launches
      # Foxglove Bridge (mapping.launch.py / navigation.launch.py with
      # visualize:=true), or Foxglove Studio will just sit at "Waiting for
      # connection..." forever even though the bridge is running fine inside
      # the container. Omit --service-ports for commands that don't need this
      # port (e.g. the separate teleop_keyboard run) to avoid a port conflict
      # with an already-running mapping/navigation container.
      - "8765:8765"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROBOT_IP=${ROBOT_IP:?set ROBOT_IP=<pi ip address> so the container can reach the zenoh router on the robot}
      - TURTLEBOT3_MODEL=burger
    volumes:
      - ./maps:/maps
    working_dir: /maps
