name: vision-tests

# Runs the vision tests on every push / PR: does the AprilTag reader get the
# right number, and does the victim detector find the yellow sign (and NOT
# false-trigger on non-yellow people) while the image is randomly rotated,
# tilted, and re-exposed. These tests are ROS-free (pure OpenCV + numpy +
# pupil-apriltags), so no ROS install is needed here.

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

jobs:
  vision:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/ttb3_perception/test/requirements-test.txt

      - name: Run vision tests
        run: pytest src/ttb3_perception/test/test_vision.py -v
